[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "copilot-agent-launcher"
version = "1.0.0"
description = "Query GitHub for available Copilot models, configure tools, and launch AI agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "PyYAML>=6.0,<7.0.0",
]

[project.scripts]
copilot-agent = "copilot_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
