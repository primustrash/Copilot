name: RE300 firmware intake security
on:
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/verify_tp_link_firmware.sh'
      - 'scripts/safe_verify_firmware_zip.py'
      - 'tests/test_safe_firmware_zip.py'
      - '.github/workflows/re300-firmware-intake.yml'
  push:
    branches:
      - codex/enhance-firmware-with-new-features
permissions:
  contents: read
jobs:
  archive-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/verify_tp_link_firmware.sh
      - name: Python syntax
        run: python3 -m compileall -q scripts/safe_verify_firmware_zip.py
      - name: Negative security regressions
        run: python3 -m unittest discover -s tests -p 'test_safe_firmware_zip.py' -v
