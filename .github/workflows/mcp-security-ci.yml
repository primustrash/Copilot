name: MCP security regression
on:
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-security-ci.yml'
  push:
    branches:
      - copilot/create-mcp-server-implementation
permissions:
  contents: read
jobs:
  security-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
