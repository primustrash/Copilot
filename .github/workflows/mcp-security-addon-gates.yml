name: MCP security-addon policy gates
on:
  pull_request:
    paths:
      - 'mcp-security-addon/**'
      - '.github/workflows/mcp-security-addon-gates.yml'
  push:
    branches:
      - copilot/create-mcp-server-extensions
permissions:
  contents: read
jobs:
  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-security-addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-security-addon/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
