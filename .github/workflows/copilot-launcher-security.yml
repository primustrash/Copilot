name: Copilot agent-launcher security
on:
  pull_request:
    paths:
      - 'copilot_agent/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/copilot-launcher-security.yml'
  push:
    branches:
      - fix/aion-agent-launcher-secure-successor-20261120
permissions:
  contents: read
jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Python syntax
        run: python -m compileall -q copilot_agent
      - name: Unit and security tests
        run: python -m pytest -q
